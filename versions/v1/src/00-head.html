<title>Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Neutral monochrome system. Chrome is black / white / true grey — buttons,
   nav, charts, meters, avatars and agent glyphs carry no hue at all.
   Colour survives in exactly one place: status. Severity stripes and status
   chips use four dark, low-chroma hues, and every one of them also ships an
   icon and a word, so meaning never rests on colour alone.
   Every text value clears 4.5:1 on its own surface in both themes.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#F4F4F5; --surface:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F1F1F3;
  --ink:#09090B; --ink-2:#4B4B53; --ink-3:#70707A;
  --line:#E2E2E6; --line-2:#EFEFF2;
  --brand:#09090B; --brand-fill:#18181B; --brand-ink:#09090B;
  --brand-soft:#F1F1F3; --brand-line:#C9C9D0; --on-brand:#FFFFFF;
  --data:#18181B; --data-soft:#F1F1F3; --data-line:#C9C9D0;
  --good:#15683A; --good-soft:#EDF6F0; --good-line:#A9CDB8;
  --warn:#8A5A05; --warn-soft:#FBF2E0; --warn-line:#DEBE7C;
  --crit:#A81F24; --crit-soft:#FBEEEE; --crit-line:#E0AAAA;
  --info:#1B4FA8; --info-soft:#EDF2FB; --info-line:#A9BEE2;
  --ramp-1:#18181B; --ramp-2:#4B4B53; --ramp-3:#8A8A93; --ramp-4:#C4C4CB; --ramp-5:#E8E8EC;
  --shadow-sm:0 1px 2px rgba(9,9,11,.06);
  --shadow:0 1px 2px rgba(9,9,11,.05),0 10px 28px -14px rgba(9,9,11,.22);
  --shadow-lg:0 2px 4px rgba(9,9,11,.07),0 24px 60px -20px rgba(9,9,11,.30);
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --display:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --rail:252px;
}
:root[data-theme="dark"]{
  --paper:#08080A; --surface:#121214; --surface-2:#18181B; --surface-3:#232327;
  --ink:#FAFAFA; --ink-2:#A8A8B2; --ink-3:#85858F;
  --line:#2A2A2F; --line-2:#1E1E22;
  --brand:#FAFAFA; --brand-fill:#FAFAFA; --brand-ink:#FAFAFA;
  --brand-soft:#232327; --brand-line:#3D3D44; --on-brand:#09090B;
  --data:#E4E4E8; --data-soft:#232327; --data-line:#3D3D44;
  --good:#5CC98A; --good-soft:#10251A; --good-line:#265238;
  --warn:#E8B04A; --warn-soft:#261C08; --warn-line:#5C4614;
  --crit:#F08A8A; --crit-soft:#2A1313; --crit-line:#5E2A2A;
  --info:#7FA9EF; --info-soft:#101B31; --info-line:#2A3F66;
  --ramp-1:#FAFAFA; --ramp-2:#B4B4BE; --ramp-3:#85858F; --ramp-4:#4B4B53; --ramp-5:#2A2A2F;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -14px rgba(0,0,0,.8);
  --shadow-lg:0 2px 4px rgba(0,0,0,.55),0 24px 60px -20px rgba(0,0,0,.9);
}

/* ───────────────────────────── base ───────────────────────────── */
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;margin:0;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.012em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-2)}
.display{font-family:var(--display);font-weight:700;letter-spacing:-.034em;line-height:1.05;font-feature-settings:"tnum" 1,"cv05" 1}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.tiny{font-size:12.5px}
.nowrap{white-space:nowrap}

/* ───────────────────────────── shell ───────────────────────────── */
.topbar{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 16px;height:56px}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{width:24px;height:24px;flex-shrink:0}
.brand-name{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.032em;color:var(--ink)}
.brand-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:2px 5px;margin-left:2px}
.topbar-spacer{flex:1}

/* version switcher — jumps between the version folders, keeping the route */
.versel{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;
  font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--ink-2);
  padding:5px 8px;cursor:pointer;flex-shrink:0;-webkit-appearance:none;appearance:none;
  padding-right:22px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 12px) 55%,calc(100% - 8px) 55%;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.versel:hover{color:var(--ink);border-color:var(--brand-line)}
.versel:focus-visible{outline-offset:0}

.roleswitch{display:flex;align-items:center;gap:0;background:var(--surface-2);border:1px solid var(--line);
  border-radius:7px;padding:2px;overflow-x:auto;scrollbar-width:none}
.roleswitch::-webkit-scrollbar{display:none}
.roleswitch button{background:none;border:0;padding:5px 10px;border-radius:5px;cursor:pointer;
  font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:7px}
.roleswitch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);font-weight:600}
.roleswitch button:hover{color:var(--ink)}
.rs-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45;flex-shrink:0}
.roleswitch button[aria-pressed="true"] .rs-dot{opacity:1;color:var(--brand)}

.iconbtn{background:none;border:1px solid var(--line);border-radius:6px;width:32px;height:32px;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex-shrink:0}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}

.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.02em;
  background:var(--data-soft);color:var(--data);border:1px solid var(--data-line)}
.avatar.sm{width:22px;height:22px;font-size:9px}
.avatar.lg{width:38px;height:38px;font-size:13px}
.avatar.n{background:var(--surface-3);color:var(--ink-2);border-color:var(--line)}

.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:calc(100vh - 56px);align-items:start}
.rail{position:sticky;top:56px;align-self:start;height:calc(100vh - 56px);overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);padding:16px 10px 28px;display:flex;flex-direction:column;gap:2px}
.rail-head{padding:4px 10px 10px;display:flex;flex-direction:column;gap:3px}
.rail-persona{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface-2);margin-bottom:12px}
.rail-persona .nm{font-size:12.5px;font-weight:600;line-height:1.25}
.rail-sec{padding:14px 10px 5px}
.navitem{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;
  color:var(--ink-2);font-size:13.5px;font-weight:500;border:0;background:none;width:100%;text-align:left;
  text-decoration:none;line-height:1.35}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.navitem svg{flex-shrink:0;opacity:.85}
.navitem .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;
  background:var(--surface-3);color:var(--ink-2);border-radius:20px;padding:1px 6px;min-width:19px;text-align:center}
.navitem .cnt.hot{background:var(--warn-soft);color:var(--warn)}
.navitem.on .cnt{background:var(--surface);color:var(--brand-ink)}

.main{min-width:0;padding:0 0 80px}
.rail{min-width:0}
.stack>*,.split>*,.g>*,.tiles>*,.rows>*{min-width:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:24px}
.wrap.wide{max-width:1320px}

/* ───────────────────────────── page header ───────────────────────────── */
.phead{padding-block:26px 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.phead.tight{margin-bottom:0;border-bottom:0;padding-block:26px 10px}
.phead-row{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.phead h1{font-family:var(--display);font-size:clamp(25px,3.4vw,32px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
.phead .sub{color:var(--ink-2);font-size:14px;margin-top:7px;max-width:64ch}
.phead-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ───────────────────────────── controls ───────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:7px;cursor:pointer;text-decoration:none;
  font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand-fill);border-color:var(--brand-fill);color:var(--on-brand)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px;gap:5px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--crit);border-color:var(--crit-line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:1px}
.seg button{background:none;border:0;padding:5px 11px;border-radius:5px;cursor:pointer;font-size:12.5px;
  font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500}
.field .hint{font-size:12px;color:var(--ink-3);line-height:1.45}
.inp{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;
  font-size:13.5px;width:100%;min-width:0}
.inp:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{resize:vertical;line-height:1.6;font-size:13px}
select.inp{cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}

.switch{position:relative;width:34px;height:20px;border-radius:20px;background:var(--surface-3);
  border:1px solid var(--line);cursor:pointer;flex-shrink:0;padding:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:var(--surface);box-shadow:var(--shadow-sm);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--good);border-color:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(14px)}

/* ───────────────────────────── surfaces ───────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-h{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-h>*{min-width:0}
.panel-h h3{font-size:13.5px;font-weight:600}
.panel-h .r{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap;max-width:100%}
.panel-b{padding:16px}
.panel-f{padding:11px 16px;border-top:1px solid var(--line-2);background:var(--surface-2);
  border-radius:0 0 9px 9px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ruled rows — the core list primitive */
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line-2);position:relative;align-items:flex-start}
.row:last-child{border-bottom:0}
.row.link{cursor:pointer}
.row.link:hover{background:var(--surface-2)}
.row .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink-3);border-radius:0 2px 2px 0}
.row.s-hot .stripe{background:var(--warn)} .row.s-bad .stripe{background:var(--crit)}
.row.s-ok .stripe{background:var(--good)} .row.s-info .stripe{background:var(--info)}
.row.s-none .stripe{display:none}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row-title{font-size:13.5px;font-weight:600;line-height:1.4}
.row-sub{font-size:13px;color:var(--ink-2);line-height:1.55}
.row-aside{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}

/* ───────────────────────────── chips & pills ───────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;overflow:hidden;font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:.045em;text-transform:uppercase;padding:2.5px 7px;border-radius:5px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;line-height:1.45}
.chip svg{flex-shrink:0}
.chip.ok{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.chip.hot{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.chip.bad{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-line)}
.chip.info{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.chip.plain{background:none;border-color:transparent;color:var(--ink-3);padding-inline:0}
.chip.solid{background:var(--brand-fill);border-color:var(--brand-fill);color:var(--on-brand)}

.kv{display:flex;flex-direction:column;gap:3px;min-width:0}
.kv dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.kv dd{margin:0;font-size:13px;line-height:1.5}

/* ───────────────────────────── agent identity ───────────────────────────── */
.glyph{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
  font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.01em;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.glyph.lg{width:46px;height:46px;border-radius:10px;font-size:15px}
.glyph.sm{width:26px;height:26px;border-radius:6px;font-size:9.5px}
.glyph.a{background:var(--data-soft);border-color:var(--data-line);color:var(--data)}
.glyph.b{background:var(--info-soft);border-color:var(--info-line);color:var(--info)}
.glyph.c{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.glyph.d{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}
.glyph.e{background:var(--good-soft);border-color:var(--good-line);color:var(--good)}

/* ───────────────────────────── grids ───────────────────────────── */
.g{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.split.l{grid-template-columns:300px minmax(0,1fr)}
.stack{display:flex;flex-direction:column}
.stack.g8{gap:8px}.stack.g12{gap:12px}.stack.g16{gap:16px}.stack.g20{gap:20px}.stack.g28{gap:28px}
.rowflex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ───────────────────────────── metric tiles ───────────────────────────── */
.tiles{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));overflow:hidden}
.tile{padding:15px 16px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:last-child{border-right:0}
.tile .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.tile .val{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.035em;line-height:1}
.tile .val small{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--ink-2);margin-left:2px}
.tile .foot{font-size:11.5px;color:var(--ink-3);line-height:1.45}
.delta{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11px;font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)} .delta.flat{color:var(--ink-3)}

/* ───────────────────────────── tables ───────────────────────────── */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.cellname{display:flex;align-items:center;gap:9px;min-width:0}
.cellname .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ───────────────────────────── bar / meter ───────────────────────────── */
.meter{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:52px;flex:1}
.meter i{display:block;height:100%;background:var(--data);border-radius:3px}
.meter i.hot{background:var(--warn)} .meter i.bad{background:var(--crit)} .meter i.n{background:var(--data-line)}
.barlist{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) 50px;gap:10px;align-items:center;font-size:12.5px}
.barrow .bl{color:var(--ink-2);line-height:1.35;overflow-wrap:anywhere}
.barrow .bn{text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);font-weight:500}

/* ───────────────────────────── trace ───────────────────────────── */
.trace{display:flex;flex-direction:column;gap:0;position:relative;padding-left:19px}
.trace::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tstep{position:relative;padding:7px 0;font-size:13px;color:var(--ink-2);line-height:1.6}
.tstep::before{content:"";position:absolute;left:-17px;top:12px;width:7px;height:7px;border-radius:50%;
  background:var(--surface);border:1.5px solid var(--line-2);box-shadow:0 0 0 3px var(--surface)}
.tstep.done::before{background:var(--good);border-color:var(--good)}
.tstep.live::before{background:var(--warn);border-color:var(--warn)}
.tstep b{color:var(--ink);font-weight:600}

/* ───────────────────────────── chat ───────────────────────────── */
.chat{display:flex;flex-direction:column;gap:16px;padding:18px 16px}
.msg{display:flex;gap:11px;align-items:flex-start}
.msg .bub{border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.6;max-width:min(100%,640px);min-width:0}
.msg.them .bub{background:var(--surface-2);border:1px solid var(--line-2)}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:var(--brand-soft);border:1px solid var(--brand-line)}
.composer{display:flex;gap:9px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2);
