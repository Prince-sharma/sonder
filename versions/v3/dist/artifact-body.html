<title>Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Neutral monochrome system. Chrome is black / white / true grey — buttons,
   nav, charts, meters, avatars and agent glyphs carry no hue at all.
   Colour survives in exactly one place: status. Severity stripes and status
   chips use four dark, low-chroma hues, and every one of them also ships an
   icon and a word, so meaning never rests on colour alone.
   Every text value clears 4.5:1 on its own surface in both themes.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --paper:#F4F4F5; --surface:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F1F1F3;
  --ink:#09090B; --ink-2:#4B4B53; --ink-3:#70707A;
  --line:#E2E2E6; --line-2:#EFEFF2;
  --brand:#09090B; --brand-fill:#18181B; --brand-ink:#09090B;
  --brand-soft:#F1F1F3; --brand-line:#C9C9D0; --on-brand:#FFFFFF;
  --data:#18181B; --data-soft:#F1F1F3; --data-line:#C9C9D0;
  --good:#15683A; --good-soft:#EDF6F0; --good-line:#A9CDB8;
  --warn:#8A5A05; --warn-soft:#FBF2E0; --warn-line:#DEBE7C;
  --crit:#A81F24; --crit-soft:#FBEEEE; --crit-line:#E0AAAA;
  --info:#1B4FA8; --info-soft:#EDF2FB; --info-line:#A9BEE2;
  --ramp-1:#18181B; --ramp-2:#4B4B53; --ramp-3:#8A8A93; --ramp-4:#C4C4CB; --ramp-5:#E8E8EC;
  --shadow-sm:0 1px 2px rgba(9,9,11,.06);
  --shadow:0 1px 2px rgba(9,9,11,.05),0 10px 28px -14px rgba(9,9,11,.22);
  --shadow-lg:0 2px 4px rgba(9,9,11,.07),0 24px 60px -20px rgba(9,9,11,.30);
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --display:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --rail:252px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#08080A; --surface:#121214; --surface-2:#18181B; --surface-3:#232327;
    --ink:#FAFAFA; --ink-2:#A8A8B2; --ink-3:#85858F;
    --line:#2A2A2F; --line-2:#1E1E22;
    --brand:#FAFAFA; --brand-fill:#FAFAFA; --brand-ink:#FAFAFA;
    --brand-soft:#232327; --brand-line:#3D3D44; --on-brand:#09090B;
    --data:#E4E4E8; --data-soft:#232327; --data-line:#3D3D44;
    --good:#5CC98A; --good-soft:#10251A; --good-line:#265238;
    --warn:#E8B04A; --warn-soft:#261C08; --warn-line:#5C4614;
    --crit:#F08A8A; --crit-soft:#2A1313; --crit-line:#5E2A2A;
    --info:#7FA9EF; --info-soft:#101B31; --info-line:#2A3F66;
    --ramp-1:#FAFAFA; --ramp-2:#B4B4BE; --ramp-3:#85858F; --ramp-4:#4B4B53; --ramp-5:#2A2A2F;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -14px rgba(0,0,0,.8);
    --shadow-lg:0 2px 4px rgba(0,0,0,.55),0 24px 60px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#08080A; --surface:#121214; --surface-2:#18181B; --surface-3:#232327;
  --ink:#FAFAFA; --ink-2:#A8A8B2; --ink-3:#85858F;
  --line:#2A2A2F; --line-2:#1E1E22;
  --brand:#FAFAFA; --brand-fill:#FAFAFA; --brand-ink:#FAFAFA;
  --brand-soft:#232327; --brand-line:#3D3D44; --on-brand:#09090B;
  --data:#E4E4E8; --data-soft:#232327; --data-line:#3D3D44;
  --good:#5CC98A; --good-soft:#10251A; --good-line:#265238;
  --warn:#E8B04A; --warn-soft:#261C08; --warn-line:#5C4614;
  --crit:#F08A8A; --crit-soft:#2A1313; --crit-line:#5E2A2A;
  --info:#7FA9EF; --info-soft:#101B31; --info-line:#2A3F66;
  --ramp-1:#FAFAFA; --ramp-2:#B4B4BE; --ramp-3:#85858F; --ramp-4:#4B4B53; --ramp-5:#2A2A2F;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -14px rgba(0,0,0,.8);
  --shadow-lg:0 2px 4px rgba(0,0,0,.55),0 24px 60px -20px rgba(0,0,0,.9);
}

/* ───────────────────────────── base ───────────────────────────── */
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;margin:0;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.012em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-2)}
.display{font-family:var(--display);font-weight:700;letter-spacing:-.034em;line-height:1.05;font-feature-settings:"tnum" 1,"cv05" 1}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.tiny{font-size:12.5px}
.nowrap{white-space:nowrap}

/* ───────────────────────────── shell ───────────────────────────── */
.topbar{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 16px;height:56px}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{width:24px;height:24px;flex-shrink:0}
.brand-name{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.032em;color:var(--ink)}
.brand-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:2px 5px;margin-left:2px}
.topbar-spacer{flex:1}

.roleswitch{display:flex;align-items:center;gap:0;background:var(--surface-2);border:1px solid var(--line);
  border-radius:7px;padding:2px;overflow-x:auto;scrollbar-width:none}
.roleswitch::-webkit-scrollbar{display:none}
.roleswitch button{background:none;border:0;padding:5px 10px;border-radius:5px;cursor:pointer;
  font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:7px}
.roleswitch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm);font-weight:600}
.roleswitch button:hover{color:var(--ink)}
.rs-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.45;flex-shrink:0}
.roleswitch button[aria-pressed="true"] .rs-dot{opacity:1;color:var(--brand)}

.iconbtn{background:none;border:1px solid var(--line);border-radius:6px;width:32px;height:32px;
  display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex-shrink:0}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}

.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.02em;
  background:var(--data-soft);color:var(--data);border:1px solid var(--data-line)}
.avatar.sm{width:22px;height:22px;font-size:9px}
.avatar.lg{width:38px;height:38px;font-size:13px}
.avatar.n{background:var(--surface-3);color:var(--ink-2);border-color:var(--line)}

.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:calc(100vh - 56px);align-items:start}
.rail{position:sticky;top:56px;align-self:start;height:calc(100vh - 56px);overflow-y:auto;
  background:var(--surface);border-right:1px solid var(--line);padding:16px 10px 28px;display:flex;flex-direction:column;gap:2px}
.rail-head{padding:4px 10px 10px;display:flex;flex-direction:column;gap:3px}
.rail-persona{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface-2);margin-bottom:12px}
.rail-persona .nm{font-size:12.5px;font-weight:600;line-height:1.25}
.rail-sec{padding:14px 10px 5px}
.navitem{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;
  color:var(--ink-2);font-size:13.5px;font-weight:500;border:0;background:none;width:100%;text-align:left;
  text-decoration:none;line-height:1.35}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.navitem svg{flex-shrink:0;opacity:.85}
.navitem .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-weight:600;
  background:var(--surface-3);color:var(--ink-2);border-radius:20px;padding:1px 6px;min-width:19px;text-align:center}
.navitem .cnt.hot{background:var(--warn-soft);color:var(--warn)}
.navitem.on .cnt{background:var(--surface);color:var(--brand-ink)}

.main{min-width:0;padding:0 0 80px}
.rail{min-width:0}
.stack>*,.split>*,.g>*,.tiles>*,.rows>*{min-width:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:24px}
.wrap.wide{max-width:1320px}

/* ───────────────────────────── page header ───────────────────────────── */
.phead{padding-block:26px 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.phead.tight{margin-bottom:0;border-bottom:0;padding-block:26px 10px}
.phead-row{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.phead h1{font-family:var(--display);font-size:clamp(25px,3.4vw,32px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
.phead .sub{color:var(--ink-2);font-size:14px;margin-top:7px;max-width:64ch}
.phead-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ───────────────────────────── controls ───────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:7px;cursor:pointer;text-decoration:none;
  font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand-fill);border-color:var(--brand-fill);color:var(--on-brand)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px;gap:5px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--crit);border-color:var(--crit-line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:1px}
.seg button{background:none;border:0;padding:5px 11px;border-radius:5px;cursor:pointer;font-size:12.5px;
  font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500}
.field .hint{font-size:12px;color:var(--ink-3);line-height:1.45}
.inp{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;
  font-size:13.5px;width:100%;min-width:0}
.inp:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
textarea.inp{resize:vertical;line-height:1.6;font-size:13px}
select.inp{cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}

.switch{position:relative;width:34px;height:20px;border-radius:20px;background:var(--surface-3);
  border:1px solid var(--line);cursor:pointer;flex-shrink:0;padding:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:var(--surface);box-shadow:var(--shadow-sm);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--good);border-color:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(14px)}

/* ───────────────────────────── surfaces ───────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-h{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-h>*{min-width:0}
.panel-h h3{font-size:13.5px;font-weight:600}
.panel-h .r{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap;max-width:100%}
.panel-b{padding:16px}
.panel-f{padding:11px 16px;border-top:1px solid var(--line-2);background:var(--surface-2);
  border-radius:0 0 9px 9px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ruled rows — the core list primitive */
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line-2);position:relative;align-items:flex-start}
.row:last-child{border-bottom:0}
.row.link{cursor:pointer}
.row.link:hover{background:var(--surface-2)}
.row .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink-3);border-radius:0 2px 2px 0}
.row.s-hot .stripe{background:var(--warn)} .row.s-bad .stripe{background:var(--crit)}
.row.s-ok .stripe{background:var(--good)} .row.s-info .stripe{background:var(--info)}
.row.s-none .stripe{display:none}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row-title{font-size:13.5px;font-weight:600;line-height:1.4}
.row-sub{font-size:13px;color:var(--ink-2);line-height:1.55}
.row-aside{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}

/* ───────────────────────────── chips & pills ───────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;overflow:hidden;font-family:var(--mono);font-size:11px;font-weight:500;
  letter-spacing:.045em;text-transform:uppercase;padding:2.5px 7px;border-radius:5px;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;line-height:1.45}
.chip svg{flex-shrink:0}
.chip.ok{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.chip.hot{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.chip.bad{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-line)}
.chip.info{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.chip.plain{background:none;border-color:transparent;color:var(--ink-3);padding-inline:0}
.chip.solid{background:var(--brand-fill);border-color:var(--brand-fill);color:var(--on-brand)}

.kv{display:flex;flex-direction:column;gap:3px;min-width:0}
.kv dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.kv dd{margin:0;font-size:13px;line-height:1.5}

/* ───────────────────────────── agent identity ───────────────────────────── */
.glyph{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
  font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.01em;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.glyph.lg{width:46px;height:46px;border-radius:10px;font-size:15px}
.glyph.sm{width:26px;height:26px;border-radius:6px;font-size:9.5px}
.glyph.a{background:var(--data-soft);border-color:var(--data-line);color:var(--data)}
.glyph.b{background:var(--info-soft);border-color:var(--info-line);color:var(--info)}
.glyph.c{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.glyph.d{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink)}
.glyph.e{background:var(--good-soft);border-color:var(--good-line);color:var(--good)}

/* ───────────────────────────── grids ───────────────────────────── */
.g{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.split.l{grid-template-columns:300px minmax(0,1fr)}
.stack{display:flex;flex-direction:column}
.stack.g8{gap:8px}.stack.g12{gap:12px}.stack.g16{gap:16px}.stack.g20{gap:20px}.stack.g28{gap:28px}
.rowflex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ───────────────────────────── metric tiles ───────────────────────────── */
.tiles{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));overflow:hidden}
.tile{padding:15px 16px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:last-child{border-right:0}
.tile .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.tile .val{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.035em;line-height:1}
.tile .val small{font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--ink-2);margin-left:2px}
.tile .foot{font-size:11.5px;color:var(--ink-3);line-height:1.45}
.delta{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:11px;font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)} .delta.flat{color:var(--ink-3)}

/* ───────────────────────────── tables ───────────────────────────── */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.cellname{display:flex;align-items:center;gap:9px;min-width:0}
.cellname .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ───────────────────────────── bar / meter ───────────────────────────── */
.meter{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:52px;flex:1}
.meter i{display:block;height:100%;background:var(--data);border-radius:3px}
.meter i.hot{background:var(--warn)} .meter i.bad{background:var(--crit)} .meter i.n{background:var(--data-line)}
.barlist{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2fr) 50px;gap:10px;align-items:center;font-size:12.5px}
.barrow .bl{color:var(--ink-2);line-height:1.35;overflow-wrap:anywhere}
.barrow .bn{text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);font-weight:500}

/* ───────────────────────────── trace ───────────────────────────── */
.trace{display:flex;flex-direction:column;gap:0;position:relative;padding-left:19px}
.trace::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tstep{position:relative;padding:7px 0;font-size:13px;color:var(--ink-2);line-height:1.6}
.tstep::before{content:"";position:absolute;left:-17px;top:12px;width:7px;height:7px;border-radius:50%;
  background:var(--surface);border:1.5px solid var(--line-2);box-shadow:0 0 0 3px var(--surface)}
.tstep.done::before{background:var(--good);border-color:var(--good)}
.tstep.live::before{background:var(--warn);border-color:var(--warn)}
.tstep b{color:var(--ink);font-weight:600}

 suggest:{l:"Suggest", d:"Tells you. Never touches anything.", c:"info", icon:ICON.eye},

};

function av(id,cls=""){const p=P(id);return `<span class="avatar ${cls}" title="${esc(p.n)}">${esc(p.i)}</span>`;}
function glyph(a,cls=""){return `<span class="glyph ${a.tone||""} ${cls}">${esc(a.mono)}</span>`;}
function autChip(k){const a=AUT[k];return `<span class="chip ${a.c}" title="${esc(a.d)}">${a.icon}${a.l}</span>`;}
function verChip(a){return a.verified?`<span class="chip ok" title="Reviewed and published by a team admin">${ICON.check}Verified</span>`:
  (a.isNew?`<span class="chip info">${ICON.spark}New</span>`:"");}
function fmtMetric(m,v){
  if(m.unit==="min") return v>=60?(v/60).toFixed(1)+" h":Math.round(v)+" min";
  if(m.unit==="h")   return v.toFixed(1)+" h";
  if(m.unit==="days")return v.toFixed(1)+" d";
  if(m.unit==="/wk") return Math.round(v)+"/wk";
  return Math.round(v)+"%";
}
function metricDelta(m){
  const good = m.dir==="down" ? m.now<m.base : m.now>m.base;
  const chg = m.base===0?0:Math.round(Math.abs((m.now-m.base)/m.base)*100);
  const arrow = m.now<m.base?"↓":"↑";
  return `<span class="delta ${good?"up":"down"}">${arrow} ${chg}%</span>`;
}
function hitTarget(m){return m.dir==="down"? m.now<=m.target : m.now>=m.target;}

/* ═══════════════════════════ charts ═══════════════════════════
   All single-hue. Categorical palettes are avoided by construction:
   ordinal data uses one ramp, comparisons use accent vs neutral.     */

function spark(series,{w=112,h=30,dir="down"}={}){
  const mn=Math.min(...series), mx=Math.max(...series), r=(mx-mn)||1, pad=3;
  const pts=series.map((v,i)=>[pad+i*((w-pad*2)/(series.length-1)), h-pad-((v-mn)/r)*(h-pad*2)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=d+` L${(w-pad).toFixed(1)} ${h-pad} L${pad} ${h-pad} Z`;
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" style="display:block;overflow:visible">
    <path d="${area}" fill="var(--data)" opacity=".11"/>
    <path d="${d}" fill="none" stroke="var(--data)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="var(--data)" stroke="var(--surface)" stroke-width="2"/></svg>`;
}

function metricChart(m,{h=200}={}){
  const w=640, padL=52, padR=58, padT=24, padB=28;
  const vals=m.series.concat([m.target]);
  let mn=Math.min(...vals), mx=Math.max(...vals);
  const sp=(mx-mn)*0.18||1; mn=Math.max(0,mn-sp); mx=mx+sp;
  const X=i=>padL+i*((w-padL-padR)/(m.series.length-1));
  const Y=v=>padT+(1-(v-mn)/(mx-mn))*(h-padT-padB);
  const pts=m.series.map((v,i)=>[X(i),Y(v)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=d+` L${X(m.series.length-1).toFixed(1)} ${h-padB} L${padL} ${h-padB} Z`;
  const ty=Y(m.target);
  // keep the target caption clear of the current-value label when the two lines converge
  const tyLbl = Math.abs(ty-Y(m.series[m.series.length-1]))<20 ? ty+15 : ty+3.5;
  const ticks=[mn,(mn+mx)/2,mx];
  const last=pts[pts.length-1], first=pts[0];
  const good=hitTarget(m);
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${w} ${h}" width="100%" style="min-width:420px;display:block" role="img"
    aria-label="${esc(m.name)}: ${fmtMetric(m,m.base)} in ${m.months[0]} to ${fmtMetric(m,m.now)} in ${m.months[m.months.length-1]}, against a target of ${fmtMetric(m,m.target)}">
    ${ticks.map(t=>`<line x1="${padL}" y1="${Y(t).toFixed(1)}" x2="${w-padR}" y2="${Y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padL-9}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end" fill="var(--ink-3)" font-size="10.5" font-family="IBM Plex Mono, monospace">${fmtMetric(m,t)}</text>`).join("")}
    <line x1="${padL}" y1="${ty.toFixed(1)}" x2="${w-padR}" y2="${ty.toFixed(1)}" stroke="var(--ink-3)" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="${w-padR+7}" y="${tyLbl.toFixed(1)}" fill="var(--ink-3)" font-size="10.5" font-family="IBM Plex Mono, monospace">target</text>
    <path d="${area}" fill="var(--data)" opacity=".10"/>
    <path d="${d}" fill="none" stroke="var(--data)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${first[0].toFixed(1)}" cy="${first[1].toFixed(1)}" r="3.4" fill="var(--surface)" stroke="var(--data)" stroke-width="2"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.6" fill="var(--data)" stroke="var(--surface)" stroke-width="2.5"/>
    <text x="${(last[0]-9).toFixed(1)}" y="${(last[1]-11).toFixed(1)}" text-anchor="end" fill="var(--ink)" font-size="12.5" font-weight="600" font-family="IBM Plex Mono, monospace">${fmtMetric(m,m.now)}</text>
    ${m.months.map((mo,i)=>`<text x="${X(i).toFixed(1)}" y="${h-9}" text-anchor="middle" fill="var(--ink-3)" font-size="10.5" font-family="IBM Plex Mono, monospace">${mo}</text>`).join("")}
  </svg></div>
  <div class="rowflex tiny faint" style="margin-top:8px;gap:16px">
    <span>Baseline ${m.months[0]}: <b class="mono" style="color:var(--ink-2)">${fmtMetric(m,m.base)}</b></span>
    <span>Target: <b class="mono" style="color:var(--ink-2)">${m.dir==="down"?"≤":"≥"} ${fmtMetric(m,m.target)}</b></span>
    <span class="chip ${good?"ok":"hot"}">${good?ICON.check:ICON.alert}${good?"On target":"Short of target"}</span>
  </div>`;
}

function barlist(rows,{max=null,fmt=v=>v,cls=""}={}){
  const M=max??Math.max(...rows.map(r=>r.v),1);
  return `<div class="barlist">${rows.map(r=>`<div class="barrow">
    <span class="bl" title="${esc(r.l)}">${esc(r.l)}</span>
    <span class="meter"><i class="${r.cls||cls}" style="width:${Math.max(2,(r.v/M)*100).toFixed(1)}%"></i></span>
    <span class="bn">${fmt(r.v)}</span></div>`).join("")}</div>`;
}

/* ordinal segment bar — one hue, light to dark. Never categorical. */
function segbar(segs,total){
  const R=["var(--ramp-1)","var(--ramp-2)","var(--ramp-3)","var(--ramp-5)"];
  let acc=0;
  return `<div style="display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface-3)">
    ${segs.map((s,i)=>{acc+=s.v;return `<span title="${esc(s.l)}: ${s.v}" style="flex:${s.v};background:${R[i]};min-width:3px"></span>`}).join("")}
  </div>
  <div class="rowflex" style="gap:14px;margin-top:9px">${segs.map((s,i)=>`
    <span class="rowflex tiny" style="gap:6px"><span class="dot" style="background:${R[i]}"></span>
    <span class="faint">${esc(s.l)}</span><b class="mono" style="font-size:11.5px">${s.v}</b></span>`).join("")}</div>`;
}

function toast(msg){
  const t=document.createElement("div"); t.className="toast";
  t.innerHTML=`<span style="color:var(--data)">${ICON.check}</span>${esc(msg)}`;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function closeModal(){ $("#layer").innerHTML=""; }
function modal(html){
  $("#layer").innerHTML=`<div class="modalwrap" data-close><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#layer .modalwrap").addEventListener("click",e=>{ if(e.target.hasAttribute("data-close")) closeModal(); });
}
function note(t){ return `<div class="note">${md(t)}</div>`; }

const BUILD_CHAT=[
 {role:"agent", t:`What do you want this agent to take off your team's plate? Describe it the way you'd explain it to a new joiner — I'll turn it into a config you can edit.`},
 {role:"me", t:`When a renewal is 90 days out I want it to pull the claims MIS from the TPA, work out the ICR, find which cohort is driving the burn, and tell the AE which two design changes bring the loading down the most. Then write the story we'd tell the client about why utilisation looks the way it does.`},
 {role:"agent", t:`Good. That's a scheduled agent with a threshold trigger, not an on-demand one — it should find the account before the AE does.

Five things I need to pin down, and I've guessed at each:

**1 · What counts as "90 days out"** — I've set T-90 on policy expiry, and made it a setting the AE can move to T-120 or T-60. Renewals cluster on 1 April here, so at T-120 a lot of your book fires in one week. Worth leaving at 90.

**2 · Whose accounts** — defaulting to the AE's own book, with an option for region-wide.

**3 · What it may propose** — I've listed parent co-pay, room-rent capping, maternity sub-limit and corporate buffer resize from the Renewal Defender you already run. Family definition and sum-insured re-tiering exist but change the deal shape, so I've left them off by default.

**4 · When it must stop and ask a human** — I've set ICR above 120% to escalate to the placement desk rather than produce client-facing material. Tell me if that's the wrong line.

**5 · What it's for** — every agent here declares one metric. From what you described, the honest one is **renewal retention by lives**, measured from the policy admin system. Not "hours saved" — that's unfalsifiable.

One thing I'd push back on: you said "write the story we'd tell the client". Drafting the narrative is fine. But it shouldn't state a final renewal premium, because underwriting hasn't signed off at T-90. I've added that as a guardrail.`},
 {role:"me", t:`agree on all of it. keep 120% escalation. and it should never share member-level claim detail with the employer`},
 {role:"agent", t:`Added as a hard guardrail, and I've written two scenarios to test it — one where the client asks directly, one where they ask obliquely ("which department is claiming most?").

Config is drafted. **Twelve scenarios** generated from it, six of them adversarial. Open the Config tab to edit any field, or go straight to the Test Lab and watch it run.`}
];

    <div class="r"><span class="chip plain mono">the only object users author</span></div></div>
    <div class="panel-b"><pre class="code">Agent {
  id, name, blurb, longDescription, category, team_id | ORG
  author_id, verified, created_at

  trigger        { kind: on_demand | schedule | event | threshold,
                   cron?, event_source?, threshold_expr? }
  scopes         [ { source, access: read | write, granted: bool } ]
  instructions   text                     // inherits team business_context
  attachments    [ glossary_id, doc_id… ]

  autonomy       suggest | draft | auto_act
  guardrails     [ { rule, generates_tests: true } ]   // hard stops, per-agent
  auto_act_limits{ ceiling?, allowed_actions[], owner_id, written_reason }

  input_schema   [ InputParam ]           // ← what an installer may change
  locked_notes   [ string ]               // shown as "what you can't change"

  outcome        Outcome                  // REQUIRED to publish
  version        semver, changelog, published_at, published_by
  status         draft | in_test | awaiting_review | live | retired
}

InputParam { key, label, type: time|select|multi|text|toggle,
             options[], default, hint, required }

Outcome    { metric_name, unit, direction: up|down,
             baseline, target, source_system, source_query,
             attribution: installers_vs_non | before_after | team_aggregate }</pre></div></section>

  <div class="g g2" style="margin-bottom:18px">
    <section class="panel"><div class="panel-h"><h3>Installation</h3></div>
      <div class="panel-b"><pre class="code">Installation {
  id, agent_id, agent_version, user_id
  param_values   { key: value }   // validated against input_schema
  enabled        bool
  installed_at, last_run_at
  source         store | pre_installed | ring
  uninstalled_at?, uninstall_reason?   // ← always asked
}</pre>
      <p class="tiny faint" style="margin-top:11px">An installation pins a version. A publish advances it unless the user pinned deliberately. Param values never migrate silently — a removed key is dropped, a new key takes its default.</p></div></section>
    <section class="panel"><div class="panel-h"><h3>Run</h3></div>
      <div class="panel-b"><pre class="code">Run {
  id, installation_id, trigger_reason
  started_at, duration_ms, status
  trace          [ { step, source, detail, ts } ]   // user-visible
  items          [ RunItem ]
  tokens, cost
}
RunItem {
  id, severity, title, detail
  action_kind    none | draft | auto_acted
  artifact_ref?  // gmail draft id, hubspot task id…
  user_response  acted | dismissed | ignored | edited
  responded_at?
}</pre></div></section></div>

  <div class="g g2" style="margin-bottom:18px">
    <section class="panel"><div class="panel-h"><h3>Team &amp; business context</h3></div>

  id, name, lead_id, state: setup | live

}
BusinessContext {
  team_id

  targets          text
  incentives       text
  excellence       [ { title, why } ]   // top-performer traits

}</pre></div></section>
    <section class="panel"><div class="panel-h"><h3>Request &amp; Scenario</h3></div>

}
Scenario {

}</pre></div></section></div>

SCREENS["h/flows"]=()=>`<div class="wrap">
  ${phead("The flows that matter","Five paths. If these work, the product works.")}
  <div class="stack g16">
  ${[
   ["Install and first value","Member",[
     "Store → agent detail. The card must answer ‘what will this do to my morning' before anything else.",
     "Install → the input form built from <span class='code'>input_schema</span>. Defaults are pre-filled; a user can install without touching anything.",
     "First run happens on the agent's own trigger — not on install. A scheduled agent installed at 4pm first speaks at 08:15 tomorrow.",
     "<b>Exception:</b> offer a ‘show me what it would have said this morning' backfill run. Without it, a scheduled agent feels dead for a day and install-day churn spikes."]],
   ["Draft → approve → sent","Member",[
     "Draft-level agent produces a RunItem with <span class='code'>action_kind: draft</span> and writes the artifact in the source system, unsent.",
     "It appears in Approvals and as a feed card. Both point at the same object.",
     "Approve sends it. Edit opens the artifact in its native app (Gmail), and the platform stops tracking the edit — <b>decide this</b>: do you re-import the edited version to learn from it?",
     "Bin it records a reason. Three bins of the same kind should prompt the agent to ask why."]],
   ["Describe → config → test → publish","Team admin",[
     "Chat produces a complete draft config. The admin never sees an empty form.",
     "Config tab is authoritative. Anything the chat set can be overridden; overriding does not lock the field against future chat edits.",
     "Scenarios regenerate whenever instructions, guardrails or scopes change. Guardrail scenarios are non-deletable.",
     "Publish is blocked on: no outcome metric, any failing guardrail scenario, an unapproved new scope. Everything else is a warning.",
     "Rollout: everyone / pre-install for non-installers / ring of three then everyone."]],
   ["Complaint → change → shipped","Both",[
     "User hits a locked setting, or uninstalls. Both paths force a reason.",
     "Request lands in the admin inbox with vote count and which uninstalls it explains.",
     "Admin turns it into a change; the request is linked to the version that ships it.",
     "On publish, the release note names the person who asked. <b>This is the adoption loop</b> — it's the mechanism, not a nicety."]],
   ["Team setup","Super admin",[
     "Create team → assign lead → <b>business context interview</b> → connect sources → first agent → live.",
     "The order is enforced. Teams that published before writing context produced generic agents in this pilot.",
     "Context interview is conversational, 40 minutes, and the platform asks the questions. Do not ship a blank form."]]
  ].map(([t,who,steps])=>`<section class="panel"><div class="panel-h"><h3>${esc(t)}</h3>
    <div class="r"><span class="chip">${esc(who)}</span></div></div>

  </div>

  <section class="panel" style="margin-top:18px"><div class="panel-h"><h3>States and what they mean</h3></div>
    <div class="panel-b"><pre class="code">Agent    draft → in_test → awaiting_review → live → retired
                      ↑____________|              ↓
                                             rolled_back → live(previous)

RunItem  produced → { acted | dismissed | ignored | edited }
         ignored = no response within the next run's window.
         Track it separately from dismissed. "Ignored" is a design
         failure; "dismissed" is a judgement call. They look the
         same in every incumbent's analytics and they are not.

Install  active → paused → uninstalled(reason)
         A paused install keeps params and does not count as active.</pre></div></section></div>`;

function renderRoles(){
  $("#roleswitch").innerHTML=Object.entries(ROLES).map(([k,v])=>{
    const p=P(v.who);
    return `<button data-role="${k}" aria-pressed="${state.role===k}" title="${esc(p.n)} — ${esc(p.r)}">
      <span class="rs-dot"></span><span class="rsname">${esc(v.label)}</span></button>`}).join("");
}

function renderRail(){
  const R=ROLES[state.role], p=P(R.who);
  const item=n=>{
    if(n.s) return `<div class="rail-sec eyebrow">${esc(n.s)}</div>`;
    const c=typeof n.c==="function"?n.c():n.c;
    const on=state.route===n.r||state.route.startsWith(n.r.split("/").slice(0,2).join("/")+"/")&&n.r.split("/").length>2
             ||state.route.split("/").slice(0,2).join("/")===n.r.split("/").slice(0,2).join("/")&&n.r.split("/").length===2&&state.route.split("/").length===2;
    return `<a class="navitem${state.route===n.r||routeKey(state.route)===routeKey(n.r)?" on":""}" href="#/${n.r}">
      ${ICON[n.i]||""}<span>${esc(n.t)}</span>${c?`<span class="cnt${n.hot?" hot":""}">${c}</span>`:""}</a>`;
  };
  $("#rail").innerHTML=`
    <div class="rail-persona">${av(R.who,"lg")}
      <div style="min-width:0"><div class="nm">${esc(p.n)}</div>
        <div class="tiny faint">${esc(p.r)}</div></div></div>
    ${R.nav.map(item).join("")}
    ${HANDOFF_NAV.map(item).join("")}`;
}

const routeKey=r=>r.split("/").slice(0,2).join("/");

function render(){
  const route=(location.hash||HOME[state.role]).replace(/^#\//,"");
  state.route=route;
  const parts=route.split("/"), key=parts.slice(0,2).join("/"), arg=parts[2];
  // keep the role switcher honest about which surface you're on
  const pre=parts[0];
  if(pre==="m"&&state.role!=="member") state.role="member";
  if(pre==="a"&&state.role!=="admin")  state.role="admin";
  if(pre==="s"&&state.role!=="super")  state.role="super";
  renderRoles(); renderRail();
  const fn=SCREENS[key];
  $("#main").innerHTML = fn? fn(arg) : `<div class="wrap"><div class="empty">
    Nothing at <span class="code">#/${esc(route)}</span>. <a href="${HOME[state.role]}" style="color:var(--brand-ink);font-weight:600">Go home</a>.</div></div>`;
  window.scrollTo({top:0,behavior:"instant"});
}

function configureModal(id){
  const a=A(id); if(!a) return;

    if(p.type==="toggle") return `<button class="switch" role="switch" aria-checked="${p.val?"true":"false"}" data-act="pause" aria-label="${esc(p.label)}"></button>`;
    if(p.type==="multi") return `<div class="rowflex" style="gap:6px">${p.opts.map(o=>{
      const on=p.val.includes(o);
      return `<button class="chip ${on?"solid":""}" data-act="toggleopt" style="cursor:pointer">${on?ICON.check:""}${esc(o)}</button>`}).join("")}</div>`;
    if(p.type==="select") return `<select class="inp" id="cf-${a.id}-${p.k}">${p.opts.map(o=>
      `<option${o===p.val?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
    if(p.type==="time") return `<input class="inp" id="cf-${a.id}-${p.k}" type="time" value="${esc(p.val)}">`;

  modal(`<div class="panel-h" style="border-radius:11px 11px 0 0">${glyph(a,"sm")}
      <div><h3>${esc(a.name)} — your settings</h3>
        <div class="tiny faint" style="margin-top:2px">Changes apply only to your copy. ${a.installs-1} teammates have their own.</div></div>

    <div class="modal-b stack g20">
      ${a.params.map(p=>`<div class="field"><label>${esc(p.label)}</label>${ctrl(p)}

      <hr class="hr">
      <div class="field"><label>${ICON.lock} Set by ${esc(P(a.by).n)} — not yours to change</label>

/* ═══════════════════════════ interactions ═══════════════════════════ */
document.addEventListener("click",e=>{
  const roleBtn=e.target.closest("[data-role]");
  if(roleBtn){ state.role=roleBtn.dataset.role; location.hash=HOME[state.role]; return; }

  const tabBtn=e.target.closest("[data-tab]");
  if(tabBtn){ state.buildTab=tabBtn.dataset.tab; render(); return; }

  const act=e.target.closest("[data-act]");
  if(act){
    const k=act.dataset.act, id=act.dataset.id;
    if(k==="close"){ closeModal(); return; }
    if(k==="install"){ installModal(id); return; }
    if(k==="doinstall"){ state.installed.add(id); closeModal(); toast(`${A(id).name} installed — first run on its next trigger`); render(); return; }
    if(k==="uninstall"){ state.installed.delete(id); toast(`Uninstalled. You'll be asked why.`); render(); return; }
    if(k==="configure"){ configureModal(id); return; }
    if(k==="savecfg"){ closeModal(); toast("Saved. Applies from the next run."); return; }
    if(k==="suggest"){ suggestModal(id); return; }
    if(k==="dosuggest"){ closeModal(); toast("Sent. You'll see it in the release note if it ships."); return; }
    if(k==="approve"){ state.approved.add(id); toast("Sent."); render(); return; }
    if(k==="reject"){ state.approved.add(id); toast("Binned. Draft Desk will ask why."); render(); return; }
    if(k==="approveall"){ APPROVALS.forEach(a=>state.approved.add(a.id)); toast("All sent."); render(); return; }
    if(k==="runtests"){ state.testRun=true; toast("Ran 14 scenarios in 41 seconds"); render(); return; }
    if(k==="publish"){ toast("Published v4.2 to 14 people"); return; }
    if(k==="toggleopt"){ act.classList.toggle("solid"); return; }
    if(k==="pause"){ const on=act.getAttribute("aria-checked")==="true"; act.setAttribute("aria-checked",String(!on)); return; }
    if(k==="send"){ const ta=act.closest(".composer")?.querySelector("textarea");
      if(ta&&ta.value.trim()){ ta.value=""; toast("Sent — this is a prototype, there's no model behind it"); } return; }
    // everything else is a prototype stub
    toast("Prototype — this control isn't wired up");
    return;
  }

  const sw=e.target.closest(".switch");
  if(sw){ const on=sw.getAttribute("aria-checked")==="true"; sw.setAttribute("aria-checked",String(!on)); return; }

  const segBtn=e.target.closest(".seg button, .roleswitch button");
  if(segBtn&&segBtn.closest(".seg")){ [...segBtn.parentElement.children].forEach(b=>b.setAttribute("aria-pressed","false"));
    segBtn.setAttribute("aria-pressed","true"); return; }

  const go=e.target.closest("[data-go]");
  if(go&&!e.target.closest("a,button")){ location.hash=go.dataset.go; return; }
});

$("#notesbtn").addEventListener("click",()=>{
  state.notes=!state.notes;
  document.body.classList.toggle("notes-on",state.notes);
  $("#notesbtn").setAttribute("aria-pressed",String(state.notes));
  toast(state.notes?"Design notes on":"Design notes off");
});

$("#themebtn").addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const sysDark=window.matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur==="dark"?"light":"dark") : (sysDark?"light":"dark");
  document.documentElement.setAttribute("data-theme",next);
});

window.addEventListener("hashchange",render);
if(!location.hash) location.hash=HOME.member;
render();
</script>
