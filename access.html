<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bench — prototype access</title>
<style>
:root{
  --paper:#F4F4F5; --surface:#FFFFFF; --surface-2:#FAFAFA; --surface-3:#F1F1F3;
  --ink:#09090B; --ink-2:#4B4B53; --ink-3:#70707A;
  --line:#E2E2E6; --line-2:#EFEFF2;
  --brand-fill:#18181B; --on-brand:#FFFFFF;
  --crit:#A81F24; --crit-soft:#FBEEEE; --crit-line:#E0AAAA;
  --shadow:0 1px 2px rgba(9,9,11,.05),0 10px 28px -14px rgba(9,9,11,.22);
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;
  line-height:1.5;margin:0;-webkit-font-smoothing:antialiased;display:grid;place-items:center;
  min-height:100vh;padding:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:30px;width:100%;max-width:400px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand svg{width:26px;height:26px;flex-shrink:0}
.brand b{font-size:17px;letter-spacing:-.03em}
.brand span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--line);border-radius:3px;padding:2px 5px}
h1{font-size:17px;font-weight:650;letter-spacing:-.02em;margin:0 0 6px}
p{color:var(--ink-2);font-size:13.5px;margin:0 0 20px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:11px 13px;font:inherit;font-family:var(--mono);font-size:14px;color:var(--ink)}
input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.err{display:none;color:var(--crit);background:var(--crit-soft);border:1px solid var(--crit-line);
  border-radius:7px;padding:9px 12px;font-size:12.5px;margin-top:12px}
button{width:100%;margin-top:16px;background:var(--brand-fill);color:var(--on-brand);border:0;
  border-radius:8px;padding:11px 14px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
button:hover{opacity:.92}
.foot{margin-top:20px;color:var(--ink-3);font-size:11.5px;line-height:1.6;
  border-top:1px solid var(--line-2);padding-top:14px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="1.5" y="1.5" width="21" height="21" rx="5" stroke="currentColor" stroke-width="1.6" opacity=".3"/>
      <path d="M6.5 15.5 L6.5 8.5 M12 15.5 L12 5.5 M17.5 15.5 L17.5 11" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
      <circle cx="12" cy="18.6" r="1.5" fill="currentColor"/>
    </svg>
    <b>Bench</b><span>Prototype</span>
  </div>
  <h1>This link is passworded</h1>
  <p>A UI/UX prototype — ask Prince for the password.</p>
  <form id="f">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <div class="err" id="err">That's not it. Try again.</div>
    <button type="submit">Unlock</button>
  </form>
  <div class="foot">Unlocks this browser for 30 days. This is a casual gate for a
  design prototype, not real security — the site is static hosting.</div>
</div>
<script>
/* The hash below must match gate.js exactly. It is the SHA-256 of the
   password; the password itself is never in the source. */
var HASH="a74182d5485176d2d620fd1369134106093ccf644ac9cc731aa5c53bfcffaf83";
var DAYS=30;

function target(){
  var n=new URLSearchParams(location.search).get("next");
  if(n && n.charAt(0)==="/" && n.charAt(1)!=="/" && n.charAt(1)!=="\\") return n;
  return "index.html";
}
/* already unlocked? go straight through */
try{
  var s=(localStorage.getItem("bench-gate")||"").split("|");
  if(s[0]===HASH && Date.now()-(+s[1])<DAYS*864e5) location.replace(target());
}catch(e){}

async function sha256(str){
  var buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  var pw=document.getElementById("pw").value;
  var err=document.getElementById("err");
  if(await sha256(pw)===HASH){
    try{ localStorage.setItem("bench-gate", HASH+"|"+Date.now()); }catch(_){}
    location.replace(target());
  }else{
    err.style.display="block";
    document.getElementById("pw").value="";
    document.getElementById("pw").focus();
  }
});
</script>
</body>
</html>
